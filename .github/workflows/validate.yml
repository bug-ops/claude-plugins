name: validate

on:
  pull_request: null
  push:
    branches: [main]

jobs:
  plugin:
    name: Validate plugin and marketplace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Validate plugin manifest and components
        run: claude plugin validate --strict --json ./dev-agents

      - name: Validate marketplace catalog
        run: claude plugin validate --strict --json .

      - name: Check version consistency
        run: |
          set -euo pipefail
          plugin=$(jq -r .version dev-agents/.claude-plugin/plugin.json)
          market_meta=$(jq -r .metadata.version .claude-plugin/marketplace.json)
          market_entry=$(jq -r '.plugins[] | select(.name == "dev-agents") | .version // empty' .claude-plugin/marketplace.json)
          changelog=$(grep -m1 -oE '^## \[[0-9]+\.[0-9]+\.[0-9]+\]' dev-agents/CHANGELOG.md | tr -d '#[] ')
          badge_root=$(grep -oE 'version-[0-9]+\.[0-9]+\.[0-9]+-blue' README.md | head -1 | sed -E 's/version-(.*)-blue/\1/')
          badge_plugin=$(grep -oE 'version-[0-9]+\.[0-9]+\.[0-9]+-blue' dev-agents/README.md | head -1 | sed -E 's/version-(.*)-blue/\1/')
          echo "plugin.json=$plugin marketplace.metadata=$market_meta marketplace.entry=${market_entry:-unset} changelog=$changelog badge.root=$badge_root badge.plugin=$badge_plugin"
          if [[ -n "$market_entry" ]]; then
            echo "Marketplace entry sets version $market_entry; set it only in plugin.json" >&2
            exit 1
          fi
          for v in "$market_meta" "$changelog" "$badge_root" "$badge_plugin"; do
            if [[ "$v" != "$plugin" ]]; then
              echo "Version mismatch: expected $plugin, found $v" >&2
              exit 1
            fi
          done
